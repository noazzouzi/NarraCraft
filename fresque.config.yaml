# Fresque — réglages de production
# Toute valeur ajustable du pipeline vit ici. Rien en dur dans le code.

production:
  langue: fr
  duree_cible_min: 15          # minutes de montage final visé
  tolerance_duree_pct: 15      # ±15% acceptable avant re-découpe du script

narration:
  # Débit de lecture d'une voix off documentaire française.
  # Plus lent que l'anglais et plus lent que la parole courante : le silence
  # fait partie du format. Sert à convertir mots <-> durée dans le script.
  mots_par_minute: 140
  # Respiration insérée entre deux actes, en secondes. Compte dans la durée.
  pause_entre_actes_s: 1.2
  pause_entre_beats_s: 0.4
  # Respirations internes à un beat, déduites de la ponctuation.
  pause_phrase_s: 0.45      # après . ! ? …
  pause_virgule_s: 0.18     # après , ; :

controle:
  # Ce que `fresque lint` fait respecter. Ces règles vivaient jusqu'ici en
  # prose dans les skills, où elles n'étaient que des suggestions : rien ne
  # vérifiait qu'elles étaient suivies, et une seule fuite s'entend dans la
  # voix off finale.
  mots_par_beat: [25, 60]
  mots_par_phrase_max: 25

  # Acronymes lus comme un mot. Tous les autres doivent être ponctués
  # (U.R.S.S., F.B.I.) sinon la synthèse tranche au hasard.
  acronymes_prononces:
    - OTAN
    - SIDA
    - NASA
    - UNESCO
    - OVNI
    - RADAR
    - LASER

  # Formules de chaîne YouTube et superlatifs creux. La signature sonore du
  # contenu générique.
  interdits:
    - abonnez-vous
    - dans cette vidéo
    - dans cet article
    - mais avant ça
    - et si je vous disais
    - vous n'allez pas croire
    - incroyable
    - choquant
    - personne ne sait
    - restez jusqu'à la fin

structure:
  # Découpage narratif par défaut. Le skill script peut s'en écarter s'il
  # justifie pourquoi dans le brief.
  actes: 4
  # Une relance de rétention (question ouverte, révélation, changement de
  # rythme) au moins tous les N secondes.
  relance_retention_s: 90
  # Durée cible du hook d'ouverture, avant le premier respire.
  hook_s: 20

voix:
  # Deux moteurs, interchangeables. L'alignement est découplé (voir plus bas),
  # donc changer de provider n'impacte rien en aval du montage.
  #   kokoro     — local, gratuit, illimité. Pour tout le travail d'itération.
  #   elevenlabs — payant. Pour la finition d'une vidéo qu'on publie.
  provider: kokoro

  # Un fichier audio par beat du script. Permet de régénérer un seul beat
  # sans refaire les quinze minutes, et correspond au calibre pour lequel
  # Kokoro est conçu (segments courts, pas de long format d'un bloc).
  decoupage: par_beat

  kokoro:
    # ff_siwis est l'UNIQUE voix française de Kokoro v1.0 : féminine,
    # notée B-, moins de 11 h de données d'entraînement. Il n'y a pas
    # d'alternative dans ce modèle. Sur du long format, la prosodie se
    # répète — c'est le compromis assumé du mode itération.
    voice: ff_siwis
    lang: fr-fr
    # Mesuré : 0.82 donne ~140 mots/min, le débit documentaire visé.
    # À 1.0 la voix monte à ~170, ce qui sonne comme un reportage télé.
    speed: 0.82
    # Téléchargés depuis les releases GitHub de kokoro-onnx (voir README).
    model: models/kokoro-v1.0.onnx
    voices: models/voices-v1.0.bin

  elevenlabs:
    voice_id: ""               # à renseigner : voix FR grave, débit posé
    model: eleven_multilingual_v2
    stability: 0.45            # bas = plus expressif, haut = plus monotone
    similarity_boost: 0.8
    speed: 0.95

alignement:
  # Découplé du TTS, volontairement. On réaligne le texte QU'ON CONNAÎT DÉJÀ
  # sur l'audio produit, au lieu de faire confiance aux timestamps du moteur.
  # Plus précis (vérité terrain du texte), et rend les providers
  # interchangeables. Le français a un modèle d'alignement par défaut.
  moteur: whisperx
  langue: fr
  # Aucune transcription n'est nécessaire : on fait de l'alignement forcé,
  # le texte est déjà connu. Seul le modèle d'alignement est chargé.
  mode: forced

visuels:
  # Ordre de préférence des sources. On ne génère que ce qu'on n'a pas trouvé.
  strategie: archives_d_abord
  # Ordre de préférence. On ne génère que ce qu'aucune n'a fourni.
  sources_archives:
    - wikimedia_commons        # implémenté
    - openverse                # 52 fonds d'un coup, filtre commercial côté serveur
    - loc                      # seule source gratuite de vrai métrage 1080p
    - archive_org              # gros volume filmé, mais intrinsèquement 640x480
    - smithsonian              # CC0 net, IIIF haute résolution, couverture US
    - pixabay                  # B-roll générique moderne, en dernier recours

  # Écartées, avec le motif. Ne pas les réintroduire sans relire ceci.
  sources_exclues:
    gallica: >-
      Réutilisation COMMERCIALE payante et sous licence BnF, y compris pour
      des œuvres du domaine public (loi n° 78-753). L'API IIIF est pourtant
      excellente — inutilisable pour une chaîne monétisée.
    ina: >-
      Aucune API publique, fonds sous droits gérés, licence commerciale au
      clip. Incompatible avec un pipeline automatisé.
    mixkit: >-
      Deux licences distinctes selon l'item, non exposées dans les
      métadonnées : impossible d'arbitrer par programme.
    europeana_video: >-
      edmIsShownBy renvoie souvent des pages Vimeo plutôt que des fichiers.
      Europeana reste envisageable en source d'images.
    archive_org_newsandpublicaffairs: >-
      La TV News Archive est consultable mais ni téléchargeable ni
      réutilisable. À exclure explicitement des requêtes mediatype:movies.

  # Sources dont l'API n'expose aucun champ de licence exploitable. Leur
  # statut vient d'une politique de collection, pas de l'item. La confiance
  # est donc déclarée ici, dans un fichier versionné, jamais devinée en code.
  collections_domaine_public:
    loc:
      - national-screening-room
      - fsa-owi-black-and-white-negatives
      - detroit-publishing-company
      - bain
      - national-photo-company
      - chronicling-america
    archive_org:
      - prelinger
      - FedFlix
      - universal_newsreels
      - nasa
  generation:
    provider: gemini
    model: gemini-3.1-flash-image
    ratio: "16:9"
    # Préfixée à chaque prompt. Une direction artistique unique pour toute la
    # vidéo compte plus que la qualité d'une image isolée : cinq styles
    # différents détruisent l'illusion, une image moyenne non.
    direction_artistique: >-
      Photographie documentaire d'archive, grain argentique fin,
      lumière naturelle contrastée, palette désaturée, sans texte
      ni inscription visible
    # Plafond de sécurité : au-delà, le pipeline s'arrête et demande.
    max_images_par_projet: 120
  # Nombre de visuels visé par minute de montage.
  plans_par_minute: 8

montage:
  resolution: [1920, 1080]
  fps: 30
  # Qualité d'encodage H.264. Plus bas = meilleur et plus lourd.
  # Le défaut de Remotion (18) est quasi sans perte et produit ~12 Mbit/s sur
  # des photographies d'archive : inutilement lourd pour de la diffusion.
  # 22 tient autour de 4 Mbit/s sans différence visible en 1080p.
  crf: 22
  # Mouvement appliqué aux images fixes. Le soin mis ici fait toute la
  # différence entre un zoom moche et un mouvement crédible.
  ken_burns:
    zoom_min: 1.04
    zoom_max: 1.18
    easing: easeInOutCubic
    derive_max_pct: 6          # translation max, en % de la largeur
    micro_rotation_deg: 0.4
  traitement:
    grain: 0.06
    vignette: 0.25

  # Direction artistique. Transportée par la timeline jusqu'au moteur de
  # rendu, qui ne fait que l'appliquer. Un template la redéfinit — c'est ce
  # qui fera qu'un documentaire criminel et un documentaire historique ne se
  # ressembleront pas, sans qu'une ligne de composant change.
  palette:
    fond: "#000000"
    sous_titre: "#f4f6fa"
    voile: "rgba(0,0,0,0.72)"      # dégradé sous les sous-titres
    ombre: "rgba(0,0,0,0.55)"
    letterbox: "#0a0c10"           # fond des documents verticaux

  typographie:
    famille: "'Inter', 'Helvetica Neue', Arial, sans-serif"
    taille: 52
    graisse: 500
    interligne: 1.28
    interlettrage: "-0.01em"

  # Motion graphics. Sur un sujet fait de dates, de chefs d'accusation et de
  # peines, la moitié des plans n'a pas besoin de photographie — et une frise
  # lisible vaut mieux qu'une image d'illustration.
  motion:
    fond: "#0d1014"
    texte: "#f2f4f8"
    accent: "#c9a227"
    attenue: "#7c8698"
    famille: "'Inter', 'Helvetica Neue', Arial, sans-serif"
    # Secondes pendant lesquelles chaque élément apparaît, en cascade.
    cascade_s: 0.45

  sous_titres:
    actifs: true
    mots_par_ligne: 7

budget:
  # Le pipeline refuse de continuer au-delà, et demande confirmation.
  max_eur_par_projet: 8.0
