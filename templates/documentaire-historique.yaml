# Template — Documentaire historique narré
#
# Surcouche de fresque.config.yaml : ne redéfinit que ce qui change. Les
# champs `meta.*` sont en prose et lus par les skills ; tout le reste est lu
# par le code.
#
# Validé de bout en bout sur le pilote « Titanic, la salle des machines » :
# archives Wikimedia réelles, voix Kokoro, montage Remotion.

meta:
  nom: Documentaire historique
  description: >-
    Événement daté et documenté, raconté par la voix off sur des archives
    réelles. Le format le moins cher et le plus tolérant aux défauts.

  registre: >-
    Sobre et factuel. La tension vient de l'ordre dans lequel les
    informations arrivent, jamais des adjectifs posés dessus. Le silence
    fait partie du dispositif : une phrase courte isolée après un
    paragraphe dense frappe plus fort que n'importe quel superlatif. On
    n'annonce pas ce qu'on va dire, on le dit.

  structure_narrative: >-
    Quatre actes. I — l'événement, posé sec, avec sa date et son heure.
    II — ce qui l'a rendu possible, et que personne n'a vu venir.
    III — le pivot : ce que le spectateur croyait savoir s'effondre.
    IV — les conséquences, et ce qu'on ignore encore aujourd'hui.
    Chaque acte se termine sur une question ouverte, sauf le dernier.

  interdits_specifiques: >-
    Aucune reconstitution présentée comme une archive. Aucune date ou
    aucun chiffre sans source dans 01-research.md. Ne jamais combler un
    trou documentaire par une déduction énoncée sur le ton du fait établi :
    « on ne sait pas ce qui s'est dit dans cette pièce » est une phrase de
    documentaire, l'inventer ne l'est pas.

  sourcing: >-
    Archives d'abord, toujours. Sur un sujet historique, une photographie
    d'époque imparfaite est plus convaincante qu'une illustration générée
    impeccable, et le spectateur fait la différence sans savoir l'expliquer.
    On ne génère que l'intérieur détruit, la scène sans témoin, l'abstraction.

# --- Écriture ---------------------------------------------------------------

narration:
  # Débit tendu. Le premier montage à 140 mots/min a été jugé monotone :
  # le registre sobre ne veut pas dire lent, et une voix off documentaire
  # française tient très bien 170 sans devenir un reportage télé.
  #
  # Mesuré sur un extrait réel du script, avec la voix ff_siwis :
  #   speed 0.82 → 148 mots/min   (ancien réglage)
  #   speed 0.92 → 167 mots/min
  #   speed 0.95 → 170 mots/min   ← retenu
  #   speed 1.00 → 176 mots/min
  #   speed 1.15 → 192 mots/min   (articulation qui commence à se dégrader)
  #
  # `mots_par_minute` doit rester cohérent avec `voix.kokoro.speed` :
  # c'est lui qui convertit mots <-> durée dans tout le pipeline.
  mots_par_minute: 170
  # Les respirations sont divisées par deux. Elles restent audibles — un
  # enchaînement à zéro pause sonne synthétique — mais elles ne portent
  # plus le rythme à elles seules.
  pause_entre_actes_s: 0.9
  pause_entre_beats_s: 0.22
  pause_phrase_s: 0.30
  pause_virgule_s: 0.12

voix:
  kokoro:
    speed: 0.95

structure:
  actes: 4
  # Une relance toutes les minute au plus. À 90 s le spectateur a le temps
  # de décrocher entre deux changements d'état.
  relance_retention_s: 60
  hook_s: 15

controle:
  # Beats courts. Un beat = une unité de narration, et c'est la maille à
  # laquelle le montage peut changer d'intention. 45 mots à 170 mots/min
  # font déjà seize secondes.
  mots_par_beat: [16, 45]
  interdits:
    - abonnez-vous
    - dans cette vidéo
    - dans cet article
    - mais avant ça
    - et si je vous disais
    - vous n'allez pas croire
    - incroyable
    - choquant
    - personne ne sait
    - restez jusqu'à la fin
    # Propres au genre : la reconstitution déguisée en archive.
    - comme on peut le voir sur cette image
    - cette image montre
    - images d'archives exceptionnelles

# --- Visuels ----------------------------------------------------------------

visuels:
  # Un changement d'image toutes les quatre secondes environ. À 8 plans par
  # minute — une image toutes les sept secondes et demie — le montage a été
  # jugé monotone, et c'est mécaniquement vrai : sur quinze minutes, ça fait
  # cent vingt images là où un documentaire YouTube en montre le double.
  plans_par_minute: 15
  generation:
    direction_artistique: >-
      Photographie documentaire d'archive, grain argentique fin,
      lumière naturelle contrastée, palette désaturée, sans texte
      ni inscription visible

# --- Rendu ------------------------------------------------------------------

montage:
  # Un plan tenu plus longtemps que ça est signalé par `fresque timeline`.
  # C'est le garde-fou mécanique du rythme : la config peut viser quinze
  # plans par minute, seul l'audio réel dit si le montage les tient.
  duree_plan_max_s: 6.5

  # Mouvements plus amples qu'avant, parce que les plans sont plus courts.
  # Un zoom de 4 % étalé sur quatre secondes ne se voit pas : la caméra a
  # l'air arrêtée, et c'est exactement ce qui faisait diaporama.
  ken_burns:
    zoom_min: 1.06
    zoom_max: 1.30
    easing: easeOutCubic
    derive_max_pct: 10
    micro_rotation_deg: 0.7

  traitement:
    grain: 0.06
    vignette: 0.25

  # Lit sonore. Tierce mineure : sur un sujet judiciaire, le lit doit peser
  # sans commenter. Le niveau reste sous le seuil où l'on entend « de la
  # musique » — on ne le remarque qu'en l'enlevant, et c'est le but.
  musique:
    # Un vrai enregistrement plutôt que le lit synthétique : des cordes
    # tenues, sans rythme ni mélodie qui accroche, choisies à l'écoute
    # parmi cinq candidats libres.
    source: fichier
    fichier: assets/musiques/documentary-music-strings.mp3

    # CC BY 4.0 : le crédit DOIT figurer dans la description de chaque
    # vidéo qui l'utilise. Il est repris dans les crédits de la timeline
    # pour ne pas dépendre d'une mémoire.
    licence: CC BY 4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    auteur: tyops
    page_url: https://freesound.org/people/tyops/sounds/631776
    credit: >-
      « Documentary Music Strings » par tyops, sous licence CC BY 4.0 —
      https://freesound.org/people/tyops/sounds/631776

    # Fondu croisé qui replie la fin du morceau sur son début. Sans lui,
    # une piste de cinquante-quatre secondes claque toutes les
    # cinquante-quatre secondes pendant un quart d'heure.
    boucle_fondu_s: 4.0

    niveau_relatif_db: -22
    fondu_s: 4.0

  # Comment un plan arrive. Le format supporte des flashs, mais moins
  # appuyés qu'ailleurs : sur une façade en plein soleil, un flash à pleine
  # force blanchit l'écran.
  transitions:
    duree_s: 0.3
    fondu_noir_s: 0.6
    amorce_s: 0.12
    gain: 0.20

  # Panneaux graphiques. Un or vieilli sur un fond d'encre : c'est la
  # couleur du document officiel, et elle distingue immédiatement ce
  # template d'un documentaire criminel ou d'un portrait d'entreprise.
  motion:
    fond: "#0b0d11"
    texte: "#f2f4f8"
    accent: "#c9a227"
    attenue: "#7c8698"
    famille: "'Inter', 'Helvetica Neue', Arial, sans-serif"
    cascade_s: 0.4

    # La scène derrière le panneau. Sans elle, un panneau est un rectangle
    # noir avec du texte : il se lit comme une diapositive posée à côté du
    # film. Avec l'image du plan précédent dessous — assombrie, floutée,
    # désaturée jusqu'à n'être qu'une texture — il redevient un plan.
    #
    # Le spectateur n'identifie pas l'image. Il ne voit pas non plus le fond
    # changer de nature toutes les dix secondes, et c'est tout l'enjeu.
    scene:
      # 14 % : assez pour que le cadre ne soit pas mort, assez peu pour que
      # le texte garde son contraste sans ombre portée.
      opacite: 0.14
      flou_px: 28
      # Presque monochrome. Une texture colorée redeviendrait une image, et
      # l'œil essaierait de la lire au lieu de lire le panneau.
      saturation: 0.3
      echelle: 1.12
      # Un filet d'accent qui se trace en haut du cadre. C'est la signature
      # du template, et la seule chose qui soit purement décorative ici.
      filet: true
      # Le même traitement que les plans photographiques, en plus discret :
      # c'est ce qui fait que panneaux et archives appartiennent au même film.
      grain: 0.04
      vignette: 0.42

  palette:
    fond: "#000000"
    sous_titre: "#f4f6fa"
    voile: "rgba(0,0,0,0.72)"
    ombre: "rgba(0,0,0,0.55)"
    letterbox: "#0a0c10"

  typographie:
    famille: "'Inter', 'Helvetica Neue', Arial, sans-serif"
    taille: 52
    graisse: 500
    interligne: 1.28
    interlettrage: "-0.01em"
